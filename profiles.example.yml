# ---------------------------------------------------------------------------
# Copy this into  ~/.dbt/profiles.yml  and fill in your account details.
# Never commit real credentials. Prefer environment variables (shown below)
# or key-pair auth for anything beyond a personal trial.
#
# Find your account identifier in Snowflake:  SELECT CURRENT_ACCOUNT();
# or from the URL: https://<ACCOUNT_IDENTIFIER>.snowflakecomputing.com
# ---------------------------------------------------------------------------
spry_health:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"   # e.g. ab12345.us-east-1
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"  # or use authenticator below
      # authenticator: externalbrowser                 # for SSO instead of password

      role: TRANSFORMER
      warehouse: TRANSFORMING_WH
      database: SPRY_HEALTH
      schema: STAGING          # dbt writes dev models under this schema by default
      threads: 4
      client_session_keep_alive: False
      query_tag: dbt-spry-health
